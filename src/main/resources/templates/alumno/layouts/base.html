<!DOCTYPE html>
<html lang="es" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:fragment="title">SED | Alumno</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: { DEFAULT: "#16a34a", dark: "#15803d", light: "#22c55e" },
              secondary: { DEFAULT: "#4f46e5", dark: "#4338ca", light: "#6366f1" }
            },
            animation: {
              "spin-once": "spin 0.4s linear",
              "fade-in": "fadeIn 0.5s ease-out forwards",
              "slide-in": "slideIn 0.3s ease-out forwards",
              pulse: "pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite"
            }
          }
        }
      };
    </script>

    <!-- Estilos base -->
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>

    <!-- Tipografía -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  </head>

  <body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen flex flex-col transition-colors duration-300">
    
    <!-- Navbar principal fijo -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-primary dark:bg-gray-800 text-white shadow-lg transition-all duration-300" id="mainNav">
      <div class="container mx-auto px-4">
        <div class="flex items-center justify-between h-16">

          <!-- Logo y título -->
          <div class="flex items-center gap-3">
            <a th:href="@{/alumno/bienvenida/{usuarioId}(usuarioId=${usuario.id})}" class="flex items-center gap-2 hover:text-primary-light transition-colors duration-200">
              <i class="fas fa-graduation-cap text-2xl"></i>
              <span class="font-bold text-xl">SED</span>
            </a>
          </div>

          <!-- Navegación principal - Solo desktop -->
          <div class="hidden md:flex items-center space-x-8">
            <a th:href="@{/alumno/bienvenida/{usuarioId}(usuarioId=${usuario.id})}" class="nav-link flex items-center gap-2">
              <i class="fas fa-home"></i> <span>Inicio</span>
            </a>
            <a th:href="@{/alumno/perfil/{usuarioId}(usuarioId=${usuario.id})}" class="nav-link flex items-center gap-2">
              <i class="fas fa-user"></i> <span>Perfil</span>
            </a>
            <a th:href="@{/alumno/evaluaciones/{usuarioId}(usuarioId=${usuario.id})}" class="nav-link flex items-center gap-2">
              <i class="fas fa-clipboard-check"></i> <span>Evaluaciones</span>
            </a>
            <a th:href="@{/alumno/explorar/{usuarioId}(usuarioId=${usuario.id})}" class="nav-link flex items-center gap-2">
              <i class="fas fa-search"></i> <span>Explorar</span>
            </a>
          </div>

          <!-- Botones de acción -->
          <div class="flex items-center gap-4">
            <!-- Tema oscuro -->
            <button id="theme-toggle" aria-label="Cambiar tema" class="p-2 rounded-full hover:bg-primary-dark dark:hover:bg-gray-700 transition-colors duration-200">
              <i class="fas fa-sun dark:hidden"></i>
              <i class="fas fa-moon hidden dark:block"></i>
            </button>

            <!-- Notificaciones -->
            <button class="p-2 rounded-full hover:bg-primary-dark dark:hover:bg-gray-700 transition-colors duration-200 relative">
              <i class="fas fa-bell"></i>
              <span class="absolute -top-1 -right-1 bg-red-500 text-xs w-4 h-4 flex items-center justify-center rounded-full">2</span>
            </button>

            <!-- Menú usuario -->
            <div class="relative group">
              <button class="flex items-center gap-2 p-2 rounded-full hover:bg-primary-dark dark:hover:bg-gray-700 transition-colors duration-200">
                <div class="w-8 h-8 rounded-full bg-primary-dark flex items-center justify-center">
                  <i class="fas fa-user-circle text-lg"></i>
                </div>
                <span class="hidden md:block" th:text="${usuario.nombre}">Nombre</span>
                <i class="fas fa-chevron-down text-xs"></i>
              </button>

              <!-- Dropdown -->
              <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg py-2 hidden group-hover:block animate-fade-in">
                <a th:href="@{/alumno/perfil/{usuarioId}(usuarioId=${usuario.id})}" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
                  <i class="fas fa-user-circle mr-2"></i> Perfil
                </a>
                <a href="#" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
                  <i class="fas fa-cog mr-2"></i> Configuración
                </a>
                <hr class="my-2 border-gray-200 dark:border-gray-700" />
                <a th:href="@{/logout}" class="block px-4 py-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30">
                  <i class="fas fa-sign-out-alt mr-2"></i> Cerrar sesión
                </a>
              </div>
            </div>

            <!-- Botón menú móvil -->
            <button id="menu-toggle" aria-label="Abrir menú" class="md:hidden p-2 rounded-full hover:bg-primary-dark dark:hover:bg-gray-700 transition-colors duration-200">
              <i class="fas fa-bars"></i>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Menú móvil -->
    <div id="mobileMenu" class="fixed inset-0 z-40 transform translate-x-full transition-transform duration-300 md:hidden">
      <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="overlay"></div>
      <div class="absolute right-0 top-0 bottom-0 w-64 bg-white dark:bg-gray-800 shadow-xl">
        <div class="p-6 space-y-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-gray-800 dark:text-white">Menú</h2>
            <button id="closeMenu" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <nav class="space-y-4">
            <a th:href="@{/alumno/bienvenida/{usuarioId}(usuarioId=${usuario.id})}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
              <i class="fas fa-home"></i> <span>Inicio</span>
            </a>
            <a th:href="@{/alumno/perfil/{usuarioId}(usuarioId=${usuario.id})}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
              <i class="fas fa-user"></i> <span>Perfil</span>
            </a>
            <a th:href="@{/alumno/evaluaciones/{usuarioId}(usuarioId=${usuario.id})}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
              <i class="fas fa-clipboard-check"></i> <span>Evaluaciones</span>
            </a>
            <a th:href="@{/alumno/explorar/{usuarioId}(usuarioId=${usuario.id})}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
              <i class="fas fa-search"></i> <span>Explorar</span>
            </a>
          </nav>
        </div>
      </div>
    </div>

    <!-- Spacer para navbar -->
    <div class="h-16"></div>

    <!-- Main content -->
    <main class="flex-1 container mx-auto px-4 py-6" th:fragment="content">
      <div th:if="${messages}">
        <div th:each="msg : ${messages}" 
             th:class="'alert ' + ${msg.tipo}">
          <div class="flex items-center gap-3">
            <i th:classappend="${msg.tipo == 'success'} ? 'fas fa-check-circle' : 
                                ${msg.tipo == 'error'} ? 'fas fa-exclamation-circle' : 
                                ${msg.tipo == 'warning'} ? 'fas fa-exclamation-triangle' : 
                                'fas fa-info-circle'"></i>
            <span th:text="${msg.texto}">Mensaje</span>
          </div>
        </div>
      </div>
      <!-- Aquí se insertará el contenido específico de la página -->
    </main>

    <!-- Loader -->
    <div id="loaderOverlay" class="loader-overlay">
      <div class="loader-content">
        <div class="loader loader-pulse"></div>
        <div class="loader-text">Cargando...</div>
      </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
  </body>
</html>
