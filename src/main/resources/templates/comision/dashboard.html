<!DOCTYPE html>
<html lang="es" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${pageTitle} ?: 'SED | Comisión'">SED | Comisión</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: { primary: { DEFAULT:"#16a34a", dark:"#15803d", light:"#22c55e" } },
        animation: { "spin-once":"spin .4s linear", "fade-in":"fadeIn .5s ease-out forwards" }
      }}
    };
  </script>

  <!-- Inter + FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <style>
    body{font-family:"Inter",sans-serif}
    .nav-link{position:relative;padding:.5rem;transition:all .3s ease}
    .nav-link::after{content:"";position:absolute;bottom:-2px;left:0;width:0;height:2px;background:currentColor;transition:width .3s ease}
    .nav-link:hover::after{width:100%}
    #mainNav.scrolled{background:rgba(22,163,74,.95);backdrop-filter:blur(8px);transform:translateY(0)}
    #mainNav.hidden{transform:translateY(-100%)}
    .loader-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);z-index:9999}
    .loader-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff}
    .loader{width:48px;height:48px;border:5px solid #fff;border-bottom-color:transparent;border-radius:50%;animation:rotation 1s linear infinite}
    @keyframes rotation{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    .loader-text{margin-top:1rem;font-size:1.125rem}
  </style>
</head>

<body class="bg-slate-100 dark:bg-gray-900 text-slate-800 dark:text-white min-h-screen">
  <!-- NAV -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-emerald-600 dark:bg-gray-800 text-white shadow-lg transition-all duration-300" id="mainNav">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between h-16">

        <!-- Logo -->
        <div class="flex items-center gap-3">
          <a th:href="@{/comision/dashboard}" class="flex items-center gap-2 hover:text-emerald-100 transition-colors">
            <i class="fas fa-chart-line text-2xl"></i>
            <span class="font-bold text-xl">SED</span>
          </a>
        </div>

        <!-- Desktop nav -->
        <div class="hidden md:flex items-center space-x-8">
          <a class="nav-link flex items-center gap-2"
             th:href="@{/comision/encuesta/{userId}(userId=${userId})}">
            <i class="fas fa-pen-to-square"></i><span>Realizar Encuesta</span>
          </a>

          <!-- Reportes dropdown -->
          <div class="relative group">
            <button class="nav-link flex items-center gap-2">
              <i class="fas fa-chart-pie"></i><span>Reportes</span>
              <i class="fas fa-chevron-down text-xs ml-1"></i>
            </button>
            <div class="absolute left-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg py-2 hidden group-hover:block animate-fade-in">
              <a th:href="@{/comision/reportes/general/{userId}(userId=${userId})}"
                 class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">Resumen General</a>
              <a th:href="@{/comision/reportes/docente/{userId}(userId=${userId})}"
                 class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">Por Docente</a>
              <a th:href="@{/comision/reportes/curso/{userId}(userId=${userId})}"
                 class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">Por Curso</a>
            </div>
          </div>

          <a class="nav-link flex items-center gap-2"
             th:href="@{/comision/perfil/{userId}(userId=${userId})}">
            <i class="fas fa-user"></i><span>Perfil</span>
          </a>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-4">
          <button id="theme-toggle" aria-label="Cambiar tema"
                  class="p-2 rounded-full hover:bg-emerald-700 dark:hover:bg-gray-700">
            <i class="fas fa-sun dark:hidden"></i><i class="fas fa-moon hidden dark:block"></i>
          </button>

          <button class="p-2 rounded-full hover:bg-emerald-700 dark:hover:bg-gray-700 relative">
            <i class="fas fa-bell"></i>
            <span class="absolute -top-1 -right-1 bg-red-500 text-xs w-4 h-4 flex items-center justify-center rounded-full">3</span>
          </button>

          <!-- Usuario -->
          <div class="relative group">
            <button class="flex items-center gap-2 p-2 rounded-full hover:bg-emerald-700 dark:hover:bg-gray-700">
              <div class="w-8 h-8 rounded-full bg-emerald-700 flex items-center justify-center">
                <i class="fas fa-user-circle text-lg"></i>
              </div>
              <span class="hidden md:block" th:text="${usuarioNombre} ?: 'Comisión'">Comisión</span>
              <i class="fas fa-chevron-down text-xs"></i>
            </button>
            <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg py-2 hidden group-hover:block animate-fade-in">
              <a th:href="@{/comision/perfil/{userId}(userId=${userId})}"
                 class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
                <i class="fas fa-user-circle mr-2"></i>Perfil
              </a>
              <a href="#" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
                <i class="fas fa-cog mr-2"></i>Configuración
              </a>
              <hr class="my-2 border-gray-200 dark:border-gray-700"/>
              <a th:href="@{/logout}" class="block px-4 py-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30">
                <i class="fas fa-sign-out-alt mr-2"></i>Cerrar sesión
              </a>
            </div>
          </div>

          <!-- Menú móvil -->
          <button id="menu-toggle" aria-label="Abrir menú"
                  class="md:hidden p-2 rounded-full hover:bg-emerald-700 dark:hover:bg-gray-700">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Menú móvil -->
  <div id="mobileMenu" class="fixed inset-0 z-40 transform translate-x-full transition-transform duration-300 md:hidden">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="overlay"></div>
    <div class="absolute right-0 top-0 bottom-0 w-64 bg-white dark:bg-gray-800 shadow-xl">
      <div class="p-6 space-y-6">
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-bold text-gray-800 dark:text-white">Menú</h2>
          <button id="closeMenu" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <nav class="space-y-4">
          <a th:href="@{/comision/encuesta/{userId}(userId=${userId})}"
             class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <i class="fas fa-pen-to-square"></i><span>Realizar Encuesta</span>
          </a>
          <div class="space-y-2">
            <p class="px-3 text-sm font-semibold text-gray-500 dark:text-gray-400">Reportes</p>
            <a th:href="@{/comision/reportes/general/{userId}(userId=${userId})}"
               class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 ml-2">
              <i class="fas fa-chart-pie"></i><span>Resumen General</span>
            </a>
            <a th:href="@{/comision/reportes/docente/{userId}(userId=${userId})}"
               class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 ml-2">
              <i class="fas fa-user-tie"></i><span>Por Docente</span>
            </a>
            <a th:href="@{/comision/reportes/curso/{userId}(userId=${userId})}"
               class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 ml-2">
              <i class="fas fa-book"></i><span>Por Curso</span>
            </a>
          </div>
          <a th:href="@{/comision/perfil/{userId}(userId=${userId})}"
             class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <i class="fas fa-user"></i><span>Perfil</span>
          </a>
        </nav>
      </div>
    </div>
  </div>

  <!-- Spacer -->
  <div class="h-16"></div>

  <!-- CONTENIDO -->
  <main class="flex-1 container mx-auto px-4 py-6">

    <!-- Mensajes por query params -->
    <div class="mb-6 space-y-3" th:if="${param.success} or ${param.error} or ${param.warning} or ${param.info}">
      <div class="p-4 rounded-lg bg-green-100 text-green-800 dark:bg-green-800/30 dark:text-green-200" th:if="${param.success}">
        <div class="flex items-center gap-3"><i class="fas fa-check-circle"></i><span th:text="${param.success}">OK</span></div>
      </div>
      <div class="p-4 rounded-lg bg-red-100 text-red-800 dark:bg-red-800/30 dark:text-red-200" th:if="${param.error}">
        <div class="flex items-center gap-3"><i class="fas fa-exclamation-circle"></i><span th:text="${param.error}">Error</span></div>
      </div>
      <div class="p-4 rounded-lg bg-yellow-100 text-yellow-800 dark:bg-yellow-800/30 dark:text-yellow-200" th:if="${param.warning}">
        <div class="flex items-center gap-3"><i class="fas fa-exclamation-triangle"></i><span th:text="${param.warning}">Aviso</span></div>
      </div>
      <div class="p-4 rounded-lg bg-blue-100 text-blue-800 dark:bg-blue-800/30 dark:text-blue-200" th:if="${param.info}">
        <div class="flex items-center gap-3"><i class="fas fa-info-circle"></i><span th:text="${param.info}">Info</span></div>
      </div>
    </div>

    <!-- Tu contenido -->
    <section class="animate-fade-in">
      <h1 class="text-2xl font-bold mb-2">Bienvenido(a), <span th:text="${usuarioNombre} ?: 'Comisión'">Comisión</span></h1>
      <p class="text-sm opacity-70 mb-6" th:text="'ID: ' + ${userId}">ID:</p>
      <div class="grid md:grid-cols-3 gap-4">
        <a th:href="@{/comision/encuesta/{userId}(userId=${userId})}"
           class="p-5 rounded-xl bg-white dark:bg-gray-800 shadow hover:shadow-md transition"><i class="fas fa-pen-to-square mr-2"></i> Realizar Encuesta</a>
        <a th:href="@{/comision/reportes/general/{userId}(userId=${userId})}"
           class="p-5 rounded-xl bg-white dark:bg-gray-800 shadow hover:shadow-md transition"><i class="fas fa-chart-pie mr-2"></i> Resumen General</a>
        <a th:href="@{/comision/perfil/{userId}(userId=${userId})}"
           class="p-5 rounded-xl bg-white dark:bg-gray-800 shadow hover:shadow-md transition"><i class="fas fa-user mr-2"></i> Perfil</a>
      </div>
    </section>
  </main>

  <!-- Loader -->
  <div id="loaderOverlay" class="loader-overlay">
    <div class="loader-content">
      <div class="loader"></div>
      <div class="loader-text">Cargando...</div>
    </div>
  </div>

  <script>
    const mainNav = document.getElementById("mainNav");
    const mobileMenu = document.getElementById("mobileMenu");
    const menuToggle = document.getElementById("menu-toggle");
    const closeMenu = document.getElementById("closeMenu");
    const overlay = document.getElementById("overlay");
    const themeToggle = document.getElementById("theme-toggle");
    const htmlEl = document.documentElement;
    let lastScroll = 0;

    // Tema oscuro
    (function initTheme(){
      if (localStorage.theme === "dark" || (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        htmlEl.classList.add("dark");
      } else { htmlEl.classList.remove("dark"); }
    })();

    themeToggle.addEventListener("click", () => {
      const dark = !htmlEl.classList.contains("dark");
      htmlEl.classList.toggle("dark", dark);
      localStorage.theme = dark ? "dark" : "light";
      themeToggle.classList.add("animate-spin-once");
      setTimeout(()=>themeToggle.classList.remove("animate-spin-once"), 400);
    });

    // Scroll nav
    function handleNavScroll(){
      const y = window.pageYOffset;
      if (y <= 0) mainNav.classList.remove("scrolled","hidden");
      else if (y > lastScroll && !mainNav.classList.contains("hidden")) mainNav.classList.add("hidden");
      else if (y < lastScroll && mainNav.classList.contains("hidden")) { mainNav.classList.remove("hidden"); mainNav.classList.add("scrolled"); }
      lastScroll = y;
    }
    window.addEventListener("scroll", handleNavScroll);

    // Menú móvil
    function openMobileMenu(){ mobileMenu.classList.remove("translate-x-full"); document.body.classList.add("overflow-hidden"); }
    function closeMobileMenu(){ mobileMenu.classList.add("translate-x-full"); document.body.classList.remove("overflow-hidden"); }
    menuToggle.addEventListener("click", openMobileMenu);
    closeMenu.addEventListener("click", closeMobileMenu);
    overlay.addEventListener("click", closeMobileMenu);

    // Loader al navegar fuera
    window.addEventListener("beforeunload", ()=>{ document.getElementById("loaderOverlay").style.display = "block"; });
  </script>
</body>
</html>
