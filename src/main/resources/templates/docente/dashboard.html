<!DOCTYPE html>
<html lang="es" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de Evaluación Docente - Plataforma para gestión y evaluación docente" />
  <meta name="theme-color" content="#047857" />
  <title th:text="${pageTitle} ?: 'SED | DOCENTE'">SED | DOCENTE</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: { primary: { DEFAULT: "#16a34a", dark: "#15803d", light: "#22c55e" } },
        animation: { "spin-once": "spin 0.4s linear", "fade-in": "fadeIn 0.5s ease-out forwards" },
        keyframes: { fadeIn: { "0%": { opacity: "0" }, "100%": { opacity: "1" } } }
      }}
    };
  </script>

  <!-- Inter + FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <style>
    body { font-family: "Inter", sans-serif; }
    .nav-link{ position:relative; padding:.5rem; transition:all .3s }
    .nav-link::after{ content:""; position:absolute; bottom:-2px; left:0; width:0; height:2px; background:currentColor; transition:width .3s }
    .nav-link:hover::after{ width:100% }
    #mainNav.scrolled{ background:rgba(22,163,74,.95); backdrop-filter:blur(8px); transform:translateY(0) }
    #mainNav.hidden{ transform:translateY(-100%) }
    .loader-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(5px); z-index:9999 }
    .loader-content{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; color:#fff }
    .loader{ width:48px; height:48px; border:5px solid #fff; border-bottom-color:transparent; border-radius:50%; animation:rotation 1s linear infinite }
    @keyframes rotation{ 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
    .loader-text{ margin-top:1rem; font-size:1.125rem }
  </style>
</head>

<body class="bg-slate-100 dark:bg-gray-900 text-slate-800 dark:text-white min-h-screen">
  <!-- NAV -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-emerald-600 dark:bg-gray-800 text-white shadow-lg transition-all duration-300" id="mainNav">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between h-16">
        <!-- Logo -->
        <div class="flex items-center gap-3">
          <a th:href="@{/docente/dashboard}" class="flex items-center gap-2 hover:text-emerald-100 transition-colors duration-200">
            <i class="fas fa-chalkboard-teacher text-2xl"></i>
            <span class="font-bold text-xl">SED</span>
          </a>
        </div>

        <!-- Links desktop -->
        <div class="hidden md:flex items-center space-x-8">
          <a class="nav-link flex items-center gap-2"
             th:href="@{/docente/perfil/{usuarioId}(usuarioId=${usuarioId})}">
            <i class="fas fa-user"></i><span>Mi Perfil</span>
          </a>

          <a class="nav-link flex items-center gap-2"
             th:href="@{/docente/evaluacion/{usuarioId}(usuarioId=${usuarioId})}">
            <i class="fas fa-clipboard-check"></i><span>Ver Evaluación</span>
          </a>

          <a class="nav-link flex items-center gap-2"
             th:href="@{/docente/recomendaciones/{usuarioId}(usuarioId=${usuarioId})}">
            <i class="fas fa-lightbulb"></i><span>Recomendaciones</span>
          </a>
        </div>

        <!-- Acciones -->
        <div class="flex items-center gap-4">
          <button id="theme-toggle" aria-label="Cambiar tema" class="p-2 rounded-full hover:bg-emerald-700 dark:hover:bg-gray-700">
            <i class="fas fa-sun dark:hidden"></i><i class="fas fa-moon hidden dark:block"></i>
          </button>

          <button class="p-2 rounded-full hover:bg-emerald-700 dark:hover:bg-gray-700 relative">
            <i class="fas fa-bell"></i>
            <span class="absolute -top-1 -right-1 bg-red-500 text-xs w-4 h-4 flex items-center justify-center rounded-full">2</span>
          </button>

          <!-- Menú usuario -->
          <div class="relative group">
            <button class="flex items-center gap-2 p-2 rounded-full hover:bg-emerald-700 dark:hover:bg-gray-700">
              <div class="w-8 h-8 rounded-full bg-emerald-700 flex items-center justify-center">
                <i class="fas fa-user-circle text-lg"></i>
              </div>
              <span class="hidden md:block">Docente</span>
              <i class="fas fa-chevron-down text-xs"></i>
            </button>
            <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg py-2 hidden group-hover:block animate-fade-in">
              <a class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"
                 th:href="@{/docente/perfil/{usuarioId}(usuarioId=${usuarioId})}">
                <i class="fas fa-user-circle mr-2"></i>Mi Perfil
              </a>
              <a href="#" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">
                <i class="fas fa-cog mr-2"></i>Configuración
              </a>
              <hr class="my-2 border-gray-200 dark:border-gray-700" />
              <a th:href="@{/logout}" class="block px-4 py-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30">
                <i class="fas fa-sign-out-alt mr-2"></i>Cerrar sesión
              </a>
            </div>
          </div>

          <!-- Menú móvil -->
          <button id="menu-toggle" aria-label="Abrir menú" class="md:hidden p-2 rounded-full hover:bg-emerald-700 dark:hover:bg-gray-700">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Menú móvil -->
  <div id="mobileMenu" class="fixed inset-0 z-40 transform translate-x-full transition-transform duration-300 md:hidden">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="overlay"></div>
    <div class="absolute right-0 top-0 bottom-0 w-64 bg-white dark:bg-gray-800 shadow-xl">
      <div class="p-6 space-y-6">
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-bold text-gray-800 dark:text-white">Menú</h2>
          <button id="closeMenu" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <nav class="space-y-4">
          <a th:href="@{/docente/perfil/{usuarioId}(usuarioId=${usuarioId})}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <i class="fas fa-user"></i><span>Mi Perfil</span>
          </a>
          <a th:href="@{/docente/evaluacion/{usuarioId}(usuarioId=${usuarioId})}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <i class="fas fa-clipboard-check"></i><span>Ver Evaluación</span>
          </a>
          <a th:href="@{/docente/recomendaciones/{usuarioId}(usuarioId=${usuarioId})}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <i class="fas fa-lightbulb"></i><span>Recomendaciones</span>
          </a>
        </nav>
      </div>
    </div>
  </div>

  <!-- Spacer -->
  <div class="h-16"></div>

  <!-- CONTENIDO -->
  <main class="flex-1 container mx-auto px-4 py-6">
    <!-- Mensajes (opción A: por query params ?success/?error/?warning) -->
    <div class="mb-6 space-y-3" th:if="${param.success} or ${param.error} or ${param.warning} or ${param.info}">
      <div class="p-4 rounded-lg bg-green-100 text-green-800 dark:bg-green-800/30 dark:text-green-200" th:if="${param.success}">
        <div class="flex items-center gap-3"><i class="fas fa-check-circle"></i><span th:text="${param.success}">Operación exitosa</span></div>
      </div>
      <div class="p-4 rounded-lg bg-red-100 text-red-800 dark:bg-red-800/30 dark:text-red-200" th:if="${param.error}">
        <div class="flex items-center gap-3"><i class="fas fa-exclamation-circle"></i><span th:text="${param.error}">Ocurrió un error</span></div>
      </div>
      <div class="p-4 rounded-lg bg-yellow-100 text-yellow-800 dark:bg-yellow-800/30 dark:text-yellow-200" th:if="${param.warning}">
        <div class="flex items-center gap-3"><i class="fas fa-exclamation-triangle"></i><span th:text="${param.warning}">Advertencia</span></div>
      </div>
      <div class="p-4 rounded-lg bg-blue-100 text-blue-800 dark:bg-blue-800/30 dark:text-blue-200" th:if="${param.info}">
        <div class="flex items-center gap-3"><i class="fas fa-info-circle"></i><span th:text="${param.info}">Información</span></div>
      </div>
    </div>

    <!-- Mensajes (opción B: lista en el modelo: messages = [{type:'success', text:'...'}, ...]) -->
    <div class="mb-6 space-y-3" th:if="${messages}">
      <div th:each="m : ${messages}"
           th:class="'p-4 rounded-lg ' + (${m.type}=='success'?'bg-green-100 text-green-800 dark:bg-green-800/30 dark:text-green-200'
                    : ${m.type}=='error'?'bg-red-100 text-red-800 dark:bg-red-800/30 dark:text-red-200'
                    : ${m.type}=='warning'?'bg-yellow-100 text-yellow-800 dark:bg-yellow-800/30 dark:text-yellow-200'
                    : 'bg-blue-100 text-blue-800 dark:bg-blue-800/30 dark:text-blue-200')">
        <div class="flex items-center gap-3">
          <i th:class="${m.type}=='success'?'fas fa-check-circle'
                      : ${m.type}=='error'?'fas fa-exclamation-circle'
                      : ${m.type}=='warning'?'fas fa-exclamation-triangle'
                      : 'fas fa-info-circle'"></i>
          <span th:text="${m.text}">Mensaje</span>
        </div>
      </div>
    </div>

    <!-- AQUÍ tu contenido Thymeleaf -->
    <div>
      <h1 class="text-2xl font-bold mb-4">Bienvenido, Docente</h1>
      <p th:text="'Usuario ID: ' + ${usuarioId}">Usuario ID: </p>
    </div>
  </main>

  <!-- Loader -->
  <div id="loaderOverlay" class="loader-overlay">
    <div class="loader-content">
      <div class="loader"></div>
      <div class="loader-text">Cargando...</div>
    </div>
  </div>

  <script>
    const mainNav = document.getElementById("mainNav");
    const mobileMenu = document.getElementById("mobileMenu");
    const menuToggle = document.getElementById("menu-toggle");
    const closeMenu = document.getElementById("closeMenu");
    const overlay = document.getElementById("overlay");
    const themeToggle = document.getElementById("theme-toggle");
    const htmlEl = document.documentElement;
    let lastScroll = 0;

    function initializeTheme(){
      if (localStorage.theme === "dark" || (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        htmlEl.classList.add("dark");
      } else { htmlEl.classList.remove("dark"); }
    }
    initializeTheme();

    themeToggle.addEventListener("click", () => {
      if (htmlEl.classList.contains("dark")) { htmlEl.classList.remove("dark"); localStorage.theme = "light"; }
      else { htmlEl.classList.add("dark"); localStorage.theme = "dark"; }
      themeToggle.classList.add("animate-spin-once"); setTimeout(()=> themeToggle.classList.remove("animate-spin-once"), 400);
    });

    function handleNavScroll(){
      const currentScroll = window.pageYOffset;
      if (currentScroll <= 0) { mainNav.classList.remove("scrolled","hidden"); }
      else if (currentScroll > lastScroll && !mainNav.classList.contains("hidden")) { mainNav.classList.add("hidden"); }
      else if (currentScroll < lastScroll && mainNav.classList.contains("hidden")) { mainNav.classList.remove("hidden"); mainNav.classList.add("scrolled"); }
      lastScroll = currentScroll;
    }

    function openMobileMenu(){ mobileMenu.classList.remove("translate-x-full"); document.body.classList.add("overflow-hidden"); }
    function closeMobileMenu(){ mobileMenu.classList.add("translate-x-full"); document.body.classList.remove("overflow-hidden"); }

    window.addEventListener("scroll", handleNavScroll);
    if (menuToggle) menuToggle.addEventListener("click", openMobileMenu);
    if (closeMenu) closeMenu.addEventListener("click", closeMobileMenu);
    if (overlay) overlay.addEventListener("click", closeMobileMenu);

    window.addEventListener("beforeunload", () => { document.getElementById("loaderOverlay").style.display = "block"; });
  </script>
</body>
</html>
